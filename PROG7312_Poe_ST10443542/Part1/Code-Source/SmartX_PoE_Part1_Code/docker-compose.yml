services:
  api:
    build:
      context: .
      dockerfile: src/SmartX.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - api-uploads:/app/wwwroot/uploads

  client:
    build:
      context: src/SmartX.Client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api-uploads:
